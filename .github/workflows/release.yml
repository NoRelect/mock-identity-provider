---
name: Release

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}